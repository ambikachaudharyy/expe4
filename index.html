<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="A website sharing information about web development and technology.">

    <title>Web Development Guide</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Web Development Guide</h1>
        <p>Learn HTML, CSS and JavaScript</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="home">
            <h2>Welcome</h2>
            <p>Welcome to our web development website.</p>
            <img src="web.jpg" alt="Web development illustration">
        </section>

        <section id="about">
            <h2>About Us</h2>
            <article>
                <h3>Our Objective</h3>
                <p>We provide basic knowledge of website development.</p>
            </article>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Web Development Guide</p>
    </footer>

</body>
</html>
